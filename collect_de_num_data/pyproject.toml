dependencies = ["accelerate", "datasets", "sentencepiece", "huggingface_hub", "pandas", "pyarrow", "openpyxl", "soundfile", "numpy", "scipy", "scikit-learn", "python-dotenv", "pyyaml", "bitsandbytes>=0.49.2", "transformers>=4.56.0", "vllm==0.26.0"]

[tool.setuptools]
packages = []
